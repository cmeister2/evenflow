[package]
name = "evenflow"
version = "0.1.0"
edition = "2024"
rust-version = "1.90.0"
description = "Opinionated structural Rust linting alongside Clippy"
repository = "https://github.com/cmeister2/evenflow"
keywords = ["lint", "rust", "clippy", "tree-sitter"]
categories = ["command-line-utilities", "development-tools"]
publish = ["crates-io"]
license = "MIT OR Apache-2.0"
readme = "README.md"
include = ["/src/**", "/tests/**", "/scripts/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/DEVELOPMENT.md", "/docs/**", "/LICENSE-*", "/evenflow.toml", "/pyproject.toml", "/python/evenflow/*.py", "/python/evenflow/*.pyi", "/python/evenflow/py.typed"]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
globset = "0.4.18"
pyo3 = { version = "0.30.1", features = ["abi3-py310"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.0.0"
tree-sitter = "=0.27.2"
tree-sitter-rust = "=0.24.2"
walkdir = "2.5"

[dev-dependencies]
tempfile = "=3.27.0"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
missing_docs_in_private_items = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"

[profile.release]
lto = "thin"
strip = true

[features]
pyo3 = ["dep:pyo3"]
