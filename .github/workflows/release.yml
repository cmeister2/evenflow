name: Release artifacts

# Reused by CI after stable and minimum-version checks pass.
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  binaries:
    name: Binary (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: evenflow
          - os: macos-15
            target: aarch64-apple-darwin
            binary: evenflow
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            binary: evenflow.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: release-prepared/
      - name: Apply prepared Cargo version
        shell: bash
        run: cp release-prepared/Cargo.toml release-prepared/Cargo.lock .
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Verify executable version
        shell: bash
        run: test "$(target/${{ matrix.target }}/release/${{ matrix.binary }} --version)" = "evenflow $RELEASE_VERSION"
      - name: Check production source with the release executable
        shell: bash
        run: target/${{ matrix.target }}/release/${{ matrix.binary }} check . --strict
      - name: Verify standalone executable
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/release-smoke.sh target/${{ matrix.target }}/release/${{ matrix.binary }}
      - name: Verify standalone Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'evenflow-standalone'
          New-Item -ItemType Directory -Force -Path $smokeRoot | Out-Null
          $smokeBinary = Join-Path $smokeRoot 'evenflow.exe'
          Copy-Item 'target/${{ matrix.target }}/release/evenflow.exe' $smokeBinary
          $cleanSource = @'
          fn clean() {
              // Keep the ordered transaction together after readiness.
              if ready() {
                  prepare();
                  write();
                  commit();
              }
          }
          '@
          Set-Content -Path (Join-Path $smokeRoot 'clean.rs') -Encoding utf8 -Value $cleanSource
          Set-Content -Path (Join-Path $smokeRoot 'lint.rs') -Encoding utf8 -Value 'fn lint() { if ready() { prepare(); write(); commit(); } }'
          $originalPath = $env:PATH
          Push-Location $smokeRoot
          try {
            $env:PATH = ''
            $clean = & $smokeBinary check clean.rs --strict --format json | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or !$clean.summary.analysis_completed -or $clean.diagnostics.Count -ne 0) {
              throw 'Standalone clean scan failed'
            }
            $lint = & $smokeBinary check lint.rs --strict --format json | ConvertFrom-Json
            if ($LASTEXITCODE -ne 1 -or !$lint.summary.analysis_completed -or !($lint.diagnostics | Where-Object { $_.rule -eq 'FC001' -and $_.severity -eq 'error' })) {
              throw 'Standalone lint scan failed'
            }
          } finally {
            $env:PATH = $originalPath
            Pop-Location
          }
          # The preceding failing lint invocation was expected and asserted.
          $global:LASTEXITCODE = 0
      - name: Stage executable and documentation
        shell: bash
        run: |
          archive_root="evenflow-$RELEASE_VERSION-${{ matrix.target }}"
          mkdir -p "dist/$archive_root"
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} "dist/$archive_root/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$archive_root/"
      - name: Archive Unix executable
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czf "dist/evenflow-$RELEASE_VERSION-${{ matrix.target }}.tar.gz" -C dist "evenflow-$RELEASE_VERSION-${{ matrix.target }}"
      - name: Archive Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/evenflow-$env:RELEASE_VERSION-${{ matrix.target }}" -DestinationPath "dist/evenflow-$env:RELEASE_VERSION-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: evenflow-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  source:
    name: Cargo source package and source installation
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: release-prepared/
      - name: Apply prepared Cargo version
        run: cp release-prepared/Cargo.toml release-prepared/Cargo.lock .
      - uses: dtolnay/rust-toolchain@1.90.0
      - run: cargo package --locked --allow-dirty
      - name: Install from the packaged crate
        shell: bash
        run: |
          test -f "target/package/evenflow-$RELEASE_VERSION.crate"
          cargo install --locked --path "target/package/evenflow-$RELEASE_VERSION" --root "$RUNNER_TEMP/evenflow-installed"
          test "$("$RUNNER_TEMP/evenflow-installed/bin/evenflow" --version)" = "evenflow $RELEASE_VERSION"
          bash scripts/release-smoke.sh "$RUNNER_TEMP/evenflow-installed/bin/evenflow"
      - uses: actions/upload-artifact@v4
        with:
          name: evenflow-source
          path: target/package/*.crate
          if-no-files-found: error
