name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Stable checks and strict self-check
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --features pyo3 -- -D warnings
      - run: cargo test --locked
      - run: cargo run --locked -- check . --strict
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:release

  msrv:
    name: Minimum Rust 1.90.0
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt
      - run: cargo check --locked --features pyo3
      - run: cargo test --locked
      - run: cargo run --locked -- check . --strict

  action:
    name: GitHub Action (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-26, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
      - run: npm run test:action
      - name: Prepare a consumer project
        shell: bash
        run: |
          mkdir -p .action-smoke/src
          printf 'fn clean() {}\n' > .action-smoke/src/check.rs
      - name: Check a consumer project with the action
        uses: ./
        with:
          version: '0.1.1'
          working-directory: .action-smoke
          paths: src/
          strict: 'true'
      - name: Add a strict lint violation
        shell: bash
        run: |
          printf 'fn lint() { if ready() { prepare(); write(); commit(); } }\n' > .action-smoke/src/check.rs
      - name: Verify strict lint failures reach the workflow
        id: strict
        continue-on-error: true
        uses: ./
        with:
          version: '0.1.1'
          working-directory: .action-smoke
          paths: src/
          strict: 'true'
      - name: Require the lint action to fail
        shell: bash
        run: test "${{ steps.strict.outcome }}" = failure
      - name: Remove the consumer project
        if: always()
        shell: bash
        run: rm -rf .action-smoke

  release-plan:
    name: Plan publication
    needs: [checks, msrv, action]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    # semantic-release verifies push permission even during its dry run.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.plan.outputs.version }}
      releasing: ${{ steps.plan.outputs.releasing }}
      commit: ${{ steps.plan.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Plan and prepare versioned Cargo manifests
        id: plan
        run: npm run release:plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-plan
          path: release-prepared/
          if-no-files-found: error

  prepare:
    name: Prepare build inputs
    needs: [checks, msrv, action, release-plan]
    if: >-
      always() && !cancelled() &&
      needs.checks.result == 'success' && needs.msrv.result == 'success' &&
      needs.action.result == 'success' &&
      (needs.release-plan.result == 'success' || needs.release-plan.result == 'skipped')
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ needs.release-plan.outputs.version || steps.ci-plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Preview release and prepare manifests
        if: needs.release-plan.result == 'skipped'
        id: ci-plan
        run: npm run release:plan -- --preview
      - name: Download publication-version manifests
        if: needs.release-plan.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-plan
          path: release-prepared/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-plan
          path: release-prepared/
          if-no-files-found: error

  binaries:
    needs: prepare
    if: always() && !cancelled() && needs.prepare.result == 'success'
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    name: Binary (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: evenflow
          - os: macos-26
            target: aarch64-apple-darwin
            binary: evenflow
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            binary: evenflow.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: build-plan
          path: release-prepared/
      - name: Apply prepared Cargo version
        shell: bash
        run: cp release-prepared/Cargo.toml release-prepared/Cargo.lock .
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Verify executable version
        shell: bash
        run: test "$(target/${{ matrix.target }}/release/${{ matrix.binary }} --version)" = "evenflow $RELEASE_VERSION"
      - name: Check production source with the release executable
        shell: bash
        run: target/${{ matrix.target }}/release/${{ matrix.binary }} check . --strict
      - name: Verify standalone executable
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/release-smoke.sh target/${{ matrix.target }}/release/${{ matrix.binary }}
      - name: Verify standalone Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'evenflow-standalone'
          New-Item -ItemType Directory -Force -Path $smokeRoot | Out-Null
          $smokeBinary = Join-Path $smokeRoot 'evenflow.exe'
          Copy-Item 'target/${{ matrix.target }}/release/evenflow.exe' $smokeBinary
          $cleanSource = @'
          fn clean() {
              if ready() {
                  // Keep the ordered transaction together after readiness.
                  prepare();
                  write();
                  commit();
              }
          }
          '@
          Set-Content -Path (Join-Path $smokeRoot 'clean.rs') -Encoding utf8 -Value $cleanSource
          Set-Content -Path (Join-Path $smokeRoot 'lint.rs') -Encoding utf8 -Value 'fn lint() { if ready() { prepare(); write(); commit(); } }'
          $originalPath = $env:PATH
          Push-Location $smokeRoot
          try {
            $env:PATH = ''
            $clean = & $smokeBinary check clean.rs --strict --format json | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or !$clean.summary.analysis_completed -or $clean.diagnostics.Count -ne 0) {
              throw 'Standalone clean scan failed'
            }
            $lint = & $smokeBinary check lint.rs --strict --format json | ConvertFrom-Json
            if ($LASTEXITCODE -ne 1 -or !$lint.summary.analysis_completed -or !($lint.diagnostics | Where-Object { $_.rule -eq 'FC001' -and $_.severity -eq 'error' })) {
              throw 'Standalone lint scan failed'
            }
          } finally {
            $env:PATH = $originalPath
            Pop-Location
          }
          # The preceding failing lint invocation was expected and asserted.
          $global:LASTEXITCODE = 0
      - name: Stage executable and documentation
        shell: bash
        run: |
          archive_root="evenflow-$RELEASE_VERSION-${{ matrix.target }}"
          mkdir -p "dist/$archive_root"
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} "dist/$archive_root/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$archive_root/"
      - name: Archive Unix executable
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czf "dist/evenflow-$RELEASE_VERSION-${{ matrix.target }}.tar.gz" -C dist "evenflow-$RELEASE_VERSION-${{ matrix.target }}"
      - name: Archive Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/evenflow-$env:RELEASE_VERSION-${{ matrix.target }}" -DestinationPath "dist/evenflow-$env:RELEASE_VERSION-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: evenflow-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  source:
    needs: prepare
    if: always() && !cancelled() && needs.prepare.result == 'success'
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    name: Cargo source package and source installation
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: build-plan
          path: release-prepared/
      - name: Apply prepared Cargo version
        run: cp release-prepared/Cargo.toml release-prepared/Cargo.lock .
      - uses: dtolnay/rust-toolchain@1.90.0
      - run: cargo package --locked --allow-dirty
      - name: Verify crates.io publication
        run: cargo publish --dry-run --locked --allow-dirty --registry crates-io
      - name: Install from the packaged crate
        shell: bash
        run: |
          test -f "target/package/evenflow-$RELEASE_VERSION.crate"
          cargo install --locked --path "target/package/evenflow-$RELEASE_VERSION" --root "$RUNNER_TEMP/evenflow-installed"
          test "$("$RUNNER_TEMP/evenflow-installed/bin/evenflow" --version)" = "evenflow $RELEASE_VERSION"
          bash scripts/release-smoke.sh "$RUNNER_TEMP/evenflow-installed/bin/evenflow"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: evenflow-source
          path: target/package/*.crate
          if-no-files-found: error

  wheels:
    name: Python wheel (${{ matrix.platform.target }}, ${{ matrix.python }})
    needs: prepare
    if: always() && !cancelled() && needs.prepare.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            python-architecture: x64
          - os: macos-26
            target: aarch64-apple-darwin
            python-architecture: arm64
          - os: macos-26-intel
            target: x86_64-apple-darwin
            python-architecture: x64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            python-architecture: x64
          - os: windows-2022
            target: i686-pc-windows-msvc
            python-architecture: x86
        python: ['3.10', '3.15']
        exclude:
          # Repeated setup-python stalls before the build starts on this pairing:
          # https://github.com/cmeister2/evenflow/actions/runs/41691138486/job/126112561267
          # The Intel abi3 wheel is still built and tested with Python 3.10.
          - platform:
              os: macos-26-intel
              target: x86_64-apple-darwin
              python-architecture: x64
            python: '3.15'
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: build-plan
          path: release-prepared/
      - name: Apply shared release version
        shell: bash
        run: cp release-prepared/Cargo.toml release-prepared/Cargo.lock .
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        timeout-minutes: 10
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.platform.python-architecture }}
      - name: Build portable wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --locked --out wheels --interpreter ${{ runner.os == 'Linux' && format('python{0}', matrix.python) || 'python' }}
          manylinux: "2_28"
      - name: Install and test wheel
        shell: bash
        run: |
          python -m pip install wheels/*.whl pytest
          python -m pytest python/tests
          test "$(python -m evenflow --version)" = "evenflow ${{ needs.prepare.outputs.version }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: matrix.python == '3.10'
        with:
          name: python-wheel-${{ matrix.platform.target }}
          path: wheels/*.whl
          if-no-files-found: error

  linux-wheels:
    name: Python wheel (${{ matrix.target }}, ${{ matrix.manylinux }})
    needs: prepare
    if: always() && !cancelled() && needs.prepare.result == 'success'
    runs-on: ubuntu-26.04
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 glibc is built and tested in the native wheels job.
          - target: i686-unknown-linux-gnu
            manylinux: "2_28"
          - target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - target: armv7-unknown-linux-gnueabihf
            manylinux: "2_28"
          - target: s390x-unknown-linux-gnu
            manylinux: "2_28"
          - target: powerpc64le-unknown-linux-gnu
            manylinux: "2_28"
          - target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
          - target: i686-unknown-linux-musl
            manylinux: musllinux_1_2
          - target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
          - target: armv7-unknown-linux-musleabihf
            manylinux: musllinux_1_2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: build-plan
          path: release-prepared/
      - name: Apply shared release version
        run: cp release-prepared/Cargo.toml release-prepared/Cargo.lock .
      - name: Build portable wheel in the target's Linux container
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          # The stable ABI permits cross-compilation without a target interpreter.
          args: --release --locked --out wheels
      - name: Install and test x86_64 musllinux wheel on Alpine
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          docker run --rm --volume "$PWD:/io:ro" --workdir /io \
            --env RELEASE_VERSION python:3.10-alpine sh -ec '
              python -m pip install wheels/*.whl pytest
              python -m pytest -p no:cacheprovider python/tests
              test "$(python -m evenflow --version)" = "evenflow $RELEASE_VERSION"
            '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-wheel-${{ matrix.target }}-${{ matrix.manylinux }}
          path: wheels/*.whl
          if-no-files-found: error

  sdist:
    name: Python source distribution
    needs: prepare
    if: always() && !cancelled() && needs.prepare.result == 'success'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: build-plan
          path: release-prepared/
      - run: cp release-prepared/Cargo.toml release-prepared/Cargo.lock .
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'
      - uses: dtolnay/rust-toolchain@1.90.0
      - name: Build source distribution
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out wheels
      - name: Install and test source distribution
        run: |
          python -m pip install wheels/*.tar.gz pytest
          python -m pytest python/tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-sdist
          path: wheels/*.tar.gz
          if-no-files-found: error

  success:
    name: Success
    if: always()
    needs: [checks, msrv, action, release-plan, prepare, binaries, source, wheels, linux-wheels, sdist]
    runs-on: ubuntu-26.04
    steps:
      - name: Require all applicable checks to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          MSRV_RESULT: ${{ needs.msrv.result }}
          ACTION_RESULT: ${{ needs.action.result }}
          PLAN_RESULT: ${{ needs.release-plan.result }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          BINARIES_RESULT: ${{ needs.binaries.result }}
          WHEELS_RESULT: ${{ needs.wheels.result }}
          LINUX_WHEELS_RESULT: ${{ needs.linux-wheels.result }}
          SDIST_RESULT: ${{ needs.sdist.result }}
          SOURCE_RESULT: ${{ needs.source.result }}
          EXPECT_RELEASE_PLAN: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$MSRV_RESULT" = success
          test "$ACTION_RESULT" = success
          test "$PREPARE_RESULT" = success
          test "$BINARIES_RESULT" = success
          test "$SOURCE_RESULT" = success
          test "$WHEELS_RESULT" = success
          test "$LINUX_WHEELS_RESULT" = success
          test "$SDIST_RESULT" = success
          if [ "$EXPECT_RELEASE_PLAN" = true ]; then
            test "$PLAN_RESULT" = success
          else
            test "$PLAN_RESULT" = skipped
          fi

  release:
    name: Publish crates.io and GitHub release
    needs: [success, release-plan]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.release-plan.outputs.releasing == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-plan
          path: release-prepared/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: evenflow-*
          path: dist/
          merge-multiple: true
      - name: Publish the verified version and assets
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  pypi:
    name: Publish Python library to PyPI
    needs: [release, release-plan]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.release-plan.outputs.releasing == 'true'
    runs-on: ubuntu-26.04
    environment:
      name: pypi
      url: https://pypi.org/p/evenflow
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: python-*
          path: dist/
          merge-multiple: true
      - name: Publish tested distributions with trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
